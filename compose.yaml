# Clowder on PostgreSQL (SPEC D40). Copy .env.example to .env, change the
# password, then: docker compose up -d
#
# The first admin: docker compose run --rm clowder invite -admin
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${CLOWDER_DB_USER:-clowder}
      POSTGRES_PASSWORD: ${CLOWDER_DB_PASSWORD:?set CLOWDER_DB_PASSWORD in .env}
      POSTGRES_DB: ${CLOWDER_DB_NAME:-clowder}
    volumes:
      # PostgreSQL 18 keeps its data in a subdirectory (18/docker) of this one.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  clowder:
    build: .
    image: clowder:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CLOWDER_DATABASE_URL: postgres://${CLOWDER_DB_USER:-clowder}:${CLOWDER_DB_PASSWORD:?set CLOWDER_DB_PASSWORD in .env}@postgres:5432/${CLOWDER_DB_NAME:-clowder}?sslmode=disable
      CLOWDER_BASE_URL: ${CLOWDER_BASE_URL:-http://localhost:8080}
      CLOWDER_TRUST_PROXY: ${CLOWDER_TRUST_PROXY:-false}
      CLOWDER_LOG_LEVEL: ${CLOWDER_LOG_LEVEL:-info}
      # The SSH server of the sign-in codes (SPEC §7.16). Its host key is
      # made in /data on the first start.
      CLOWDER_SSH_ADDR: ":2222"
      # The media server of the calls (SPEC §7.18, D64): one UDP and one TCP
      # port with this number. CLOWDER_MEDIA_PUBLIC_IP is the address of this
      # machine as the people who call reach it; without it a call between two
      # people who are not on this machine's network does not connect.
      CLOWDER_MEDIA_ADDR: ":7882"
      CLOWDER_MEDIA_PUBLIC_IP: ${CLOWDER_MEDIA_PUBLIC_IP:-}
      # The metrics for Prometheus (SPEC D60) are off. To turn them on, remove
      # the "#" below: they are then served at http://clowder:9090/metrics on
      # the compose network, without a login. Do not publish the port.
      # CLOWDER_METRICS_ADDR: ":9090"
    volumes:
      - clowderdata:/data
    ports:
      - "${CLOWDER_PORT:-8080}:8080"
      - "${CLOWDER_SSH_PORT:-2222}:2222"
      # The media port of the calls: the same number inside and outside,
      # because the address that the server announces is the one it listens on.
      - "${CLOWDER_MEDIA_PORT:-7882}:7882/udp"
      - "${CLOWDER_MEDIA_PORT:-7882}:7882/tcp"
    restart: unless-stopped

volumes:
  pgdata:
  clowderdata:
