# Clowder on PostgreSQL (SPEC D40). Copy .env.example to .env, change the
# password, then: docker compose up -d
#
# The first admin: docker compose run --rm clowder invite -admin
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${CLOWDER_DB_USER:-clowder}
      POSTGRES_PASSWORD: ${CLOWDER_DB_PASSWORD:?set CLOWDER_DB_PASSWORD in .env}
      POSTGRES_DB: ${CLOWDER_DB_NAME:-clowder}
    volumes:
      # PostgreSQL 18 keeps its data in a subdirectory (18/docker) of this one.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  clowder:
    build: .
    image: clowder:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CLOWDER_DATABASE_URL: postgres://${CLOWDER_DB_USER:-clowder}:${CLOWDER_DB_PASSWORD:?set CLOWDER_DB_PASSWORD in .env}@postgres:5432/${CLOWDER_DB_NAME:-clowder}?sslmode=disable
      CLOWDER_BASE_URL: ${CLOWDER_BASE_URL:-http://localhost:8080}
      CLOWDER_TRUST_PROXY: ${CLOWDER_TRUST_PROXY:-false}
      CLOWDER_LOG_LEVEL: ${CLOWDER_LOG_LEVEL:-info}
      # The SSH server of the sign-in codes (SPEC §7.16). Its host key is
      # made in /data on the first start.
      CLOWDER_SSH_ADDR: ":2222"
    volumes:
      - clowderdata:/data
    ports:
      - "${CLOWDER_PORT:-8080}:8080"
      - "${CLOWDER_SSH_PORT:-2222}:2222"
    restart: unless-stopped

volumes:
  pgdata:
  clowderdata:
