# Several Clowder processes behind one address (SPEC D40, D41, §8.1). Use it
# together with compose.yaml:
#
#   docker compose -f compose.yaml -f compose.cluster.yaml up -d --build
#
# It adds Redis, a second Clowder process (clowder2) that shares the database
# and the data volume of the first, and Caddy, which publishes CLOWDER_PORT and
# balances the requests round-robin between the two. The processes are not
# published any more: people reach Clowder through Caddy only.
#
# The SSH server of the sign-in codes (SPEC §7.16) runs in both processes (the
# second inherits CLOWDER_SSH_ADDR from compose.yaml): a login asks for the SSH
# code only in a process that runs the server, so a user must not be able to
# skip the code by landing on a process without one. Both share one host key,
# which the first of them makes in the data volume. Only the first process
# publishes CLOWDER_SSH_PORT: Caddy balances HTTP, and the codes are kept in
# the database, so the code that either gave works in both.
#
# Calls (SPEC §7.18, D64, D65) run in both processes, each with a media port
# of its own: clowder listens on 7882 (CLOWDER_MEDIA_PORT) and clowder2 on 7883
# (CLOWDER_MEDIA_PORT2), both published for UDP and TCP, with the same number
# inside and outside, because the address a process announces is the one it
# listens on. CLOWDER_MEDIA_PUBLIC_IP (from .env) is announced by both. The
# media of a call lives in the process that started it, its home: the browsers
# of both people connect straight to that process' port, whichever process
# Caddy gave their page and their signalling WebSocket to. The process that
# does not hold the call relays the signalling through Redis (the channel
# clowder:calls:<process>), and every process keeps the key
# clowder:process:<id> in Redis while it runs, so that the others end the
# calls of a process that is gone. Open both media ports, in both protocols,
# in your firewall.
#
# The first admin: docker compose -f compose.yaml -f compose.cluster.yaml run --rm clowder invite -admin

# What both Clowder processes get besides the settings of compose.yaml: the
# Redis that carries their live events, their login counters and the
# signalling of their calls, and the proxy headers of Caddy, which is always in
# front of them here.
x-cluster-environment: &cluster-environment
  CLOWDER_REDIS_URL: redis://redis:6379/0
  CLOWDER_TRUST_PROXY: "true"

services:
  redis:
    image: redis:8
    # Redis carries only pub/sub messages, the counters of the failed logins
    # (which expire after 15 minutes) and the keys with which the processes say
    # they run (15 seconds). Nothing in it has to survive a restart, so it keeps
    # nothing on disk and has no volume (the tmpfs stops the image from making
    # an anonymous one for /data).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  clowder:
    environment: *cluster-environment
    depends_on:
      redis:
        condition: service_healthy
    # The SSH port (of the first process) and its media port, for UDP and TCP:
    # the web port is Caddy's.
    ports: !override
      - "${CLOWDER_SSH_PORT:-2222}:2222"
      - "${CLOWDER_MEDIA_PORT:-7882}:7882/udp"
      - "${CLOWDER_MEDIA_PORT:-7882}:7882/tcp"

  # The second process: the service clowder of compose.yaml (same image,
  # database, base URL, data volume, SSH address and public media IP), with
  # the settings above. Its SSH port is not published; its media port is 7883.
  clowder2:
    extends:
      file: compose.yaml
      service: clowder
    environment:
      <<: *cluster-environment
      # The SSH server runs here too (CLOWDER_SSH_ADDR is ":2222" in
      # compose.yaml): every process has the same setting.
      # Its own media port, not the one of the first process.
      CLOWDER_MEDIA_ADDR: ":7883"
    depends_on:
      redis:
        condition: service_healthy
    ports: !override
      - "${CLOWDER_MEDIA_PORT2:-7883}:7883/udp"
      - "${CLOWDER_MEDIA_PORT2:-7883}:7883/tcp"

  caddy:
    image: caddy:2
    depends_on:
      clowder:
        condition: service_healthy
      clowder2:
        condition: service_healthy
    volumes:
      - ./deploy/Caddyfile.cluster:/etc/caddy/Caddyfile:ro
    ports:
      - "${CLOWDER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
